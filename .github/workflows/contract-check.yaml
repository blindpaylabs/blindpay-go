name: Contract Check

on:
  workflow_call:

jobs:
  contract-check:
    name: Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
      - name: Check wire contract against spec snapshot
        run: go run ./cmd/contractcheck
