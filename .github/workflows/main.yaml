name: Main

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml
  tests:
    needs: lint
    uses: ./.github/workflows/tests.yaml
  contract-check:
    needs: lint
    uses: ./.github/workflows/contract-check.yaml
  apisync-check:
    needs: lint
    uses: ./.github/workflows/apisync-check.yaml
  snyk:
      needs: [lint, tests]
      uses: ./.github/workflows/snyk.yaml
      secrets: inherit
  