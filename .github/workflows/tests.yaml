name: Tests

on:
  workflow_call:

jobs:
  test:
    name: "Test: go v${{ matrix.go-version }}"
    strategy:
      matrix:
        go-version:
          # 1.21 is the go.mod floor; stable and oldstable are setup-go aliases
          # for the two supported Go releases.
          - "1.21"
          - "1.22"
          - "1.23"
          - "oldstable"
          - "stable"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build the examples
        run: go build ./examples/...
      - name: Run tests
        run: go list ./... | grep -v '/examples/' | xargs go test -v -race