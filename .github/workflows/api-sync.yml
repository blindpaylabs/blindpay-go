name: API Sync

on:
  repository_dispatch:
    types: [api-sync]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync SDK with API changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Create or checkout api-sync branch
        run: |
          git fetch origin api-sync 2>/dev/null || true
          if git rev-parse --verify origin/api-sync >/dev/null 2>&1; then
            git checkout api-sync
            git reset --hard origin/main
          else
            git checkout -b api-sync
          fi

      - name: Fetch the new spec and delivery manifest from api-sync-data
        run: |
          git fetch origin api-sync-data
          mkdir -p .api-sync
          git show origin/api-sync-data:.api-sync/spec-current.json > .api-sync/spec-current.json || {
            echo "::error::api-sync-data branch is missing .api-sync/spec-current.json"
            exit 1
          }
          git show origin/api-sync-data:.api-sync/delivery.json > /tmp/delivery.json || {
            echo "::error::api-sync-data branch is missing .api-sync/delivery.json (source_repository/source_sha/spec_sha256/generated_at manifest)"
            exit 1
          }

      - name: Verify delivery manifest
        env:
          CLIENT_PAYLOAD_SPEC_SHA256: ${{ github.event.client_payload.spec_sha256 }}
        run: |
          set -e
          for field in source_repository source_sha spec_sha256 generated_at; do
            value=$(jq -r ".${field} // \"\"" /tmp/delivery.json)
            if [ -z "$value" ]; then
              echo "::error::.api-sync/delivery.json is missing required field \"$field\""
              exit 1
            fi
          done

          manifest_sha256=$(jq -r '.spec_sha256' /tmp/delivery.json)
          actual_sha256=$(sha256sum .api-sync/spec-current.json | awk '{print $1}')
          if [ "$manifest_sha256" != "$actual_sha256" ]; then
            echo "::error::spec-current.json does not match delivery.json's spec_sha256 (manifest=$manifest_sha256, actual=$actual_sha256); refusing to sync against an unverified spec"
            exit 1
          fi

          if [ -n "$CLIENT_PAYLOAD_SPEC_SHA256" ] && [ "$CLIENT_PAYLOAD_SPEC_SHA256" != "$manifest_sha256" ]; then
            echo "::error::stale delivery: repository_dispatch client_payload.spec_sha256 ($CLIENT_PAYLOAD_SPEC_SHA256) does not match api-sync-data's delivery.json spec_sha256 ($manifest_sha256); the branch was updated again after this dispatch was sent"
            exit 1
          fi

          echo "delivery manifest verified: source=$(jq -r '.source_repository' /tmp/delivery.json)@$(jq -r '.source_sha' /tmp/delivery.json), spec_sha256=$manifest_sha256, generated_at=$(jq -r '.generated_at' /tmp/delivery.json)"

      - name: Run apisync
        id: apisync
        run: |
          set +e
          go run ./cmd/apisync -apply -spec .api-sync/spec-current.json -report /tmp/apisync-report.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "=== apisync report ==="
          cat /tmp/apisync-report.json

      - name: Fail loudly on needs-human
        if: steps.apisync.outputs.status != '0'
        run: |
          echo "::error::apisync found NEEDS_HUMAN issue(s); nothing was changed. See the report above (needs_human) for exactly what a human must decide -- update spec-map.json / unmodeled.json, or make the change by hand, then re-dispatch."
          exit 1

      - name: Commit and push
        id: commit
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.SDK_SYNC_PAT }}@github.com/${{ github.repository }}.git"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          VERSION=$(grep -oP 'const Version = "\K[^"]+' blindpay.go)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: sync SDK with API changes (v$VERSION)"
          git push --force-with-lease origin api-sync

      - name: Create or update PR and enable auto-merge
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_SYNC_PAT }}
        run: |
          PR_NUMBER=$(gh pr list --head api-sync --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "Updated with latest API changes (v${{ steps.commit.outputs.version }})."
          else
            gh pr create \
              --title "feat: sync SDK with API changes (v${{ steps.commit.outputs.version }})" \
              --body "Automated SDK update from API changes, applied by cmd/apisync. See the workflow run for the full report (applied changes, coverage gaps)." \
              --base main \
              --head api-sync \
              --label api-sync
            PR_NUMBER=$(gh pr list --head api-sync --json number --jq '.[0].number')
          fi
          # release.yml tags and releases on merge only when the PR carries
          # this label; apply it every run in case a prior run's label was
          # removed by hand.
          gh pr edit "$PR_NUMBER" --add-label release
          gh pr merge "$PR_NUMBER" --auto --squash
